name: Deploy to Cloudflare Pages

on:
  # Every merge to main ships.
  push:
    branches: [main]
  # …and a deploy can be triggered by hand from the Actions tab.
  workflow_dispatch:

# Never let two deploys race to the same project.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  # Deploying needs credentials that live outside the repository, so until they
  # are set this workflow has nothing to do. It reports that and SKIPS, rather
  # than failing: a `main` that is red purely because a deploy is unconfigured
  # teaches everyone to ignore red, and hides the next real failure.
  #
  # This is a separate job because the `secrets` context is not available in a
  # job-level `if:`, but `needs` is.
  guard:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Cloudflare credentials are not configured. Add CLOUDFLARE_API_TOKEN (needs the 'Cloudflare Pages — Edit' permission) and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions. See README → Deploying."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          # The Pages PROJECT must already exist: `pages deploy` cannot create
          # one non-interactively and fails with "Project not found". Create it
          # once (see README → Deploying), after which every run lands on it.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=africa-energy-atlas
